# FloodWatch Ghana — Nginx reverse proxy configuration
#
# Routes:
#   /            -> Gunicorn (Django views + REST API)        port 8000
#   /ws/         -> Daphne (WebSocket: live sensors + alerts)  port 8001
#   /static/     -> served directly by Nginx (collectstatic output)
#   /media/      -> served directly by Nginx (user uploads: report photos)
#
# Install: copy to /etc/nginx/sites-available/floodwatch.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.

upstream floodwatch_django {
    server web:8000;
}

upstream floodwatch_websocket {
    server websocket:8001;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name floodwatch.gh www.floodwatch.gh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name floodwatch.gh www.floodwatch.gh;

    # Let's Encrypt certificate paths -- obtain via:
    #   certbot certonly --webroot -w /var/www/certbot -d floodwatch.gh -d www.floodwatch.gh
    ssl_certificate     /etc/letsencrypt/live/floodwatch.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floodwatch.gh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;  # community report photo uploads

    location /static/ {
        alias /app/src/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/src/media/;
        expires 7d;
    }

    # WebSocket upgrade for live sensor/alert streams -- must come before
    # the catch-all location so /ws/ is never accidentally proxied to Gunicorn.
    location /ws/ {
        proxy_pass http://floodwatch_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets are long-lived -- the default 60s proxy_read_timeout
        # would silently disconnect an idle-but-still-open dashboard socket.
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://floodwatch_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Let's Encrypt HTTP-01 challenge path (used during initial cert issuance
    # and renewal; harmless to leave permanently configured).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
