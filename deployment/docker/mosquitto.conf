# Mosquitto MQTT broker config for FloodWatch Ghana ESP32 sensor ingestion.
#
# Development default: anonymous access on the unencrypted port so ESP32
# units on the local network can connect without certificate provisioning.
# For production, set password_file and listener 8883 with TLS certs —
# see docs/deployment/mqtt_tls.md.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
